kind: Task
apiVersion: mcpchecker/v1alpha2
metadata:
  name: job-report
  difficulty: medium
  labels:
    suite: jobs
    category: basic
  parallel: true
spec:
  prompt:
    inline: |
      Get the CI job report for the current in-development OpenShift release.
      Focus on jobs for single node openshift on the aws platform.
      Summarize the worst-performing job by pass rate.
